[package]
name = "network-speaker-control"
version = "1.0.0"
edition = "2021"
description = "Controller for MusicCast-compatible network speakers"
license = "GPL-3.0-or-later"
repository = "https://github.com/flgerritse/musiccast-controller"

[dependencies]
eframe = { version = "0.37", default-features = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21"
ureq = { version = "2", features = ["json"] }
tiny_http = "0.12"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }
winit = { version = "0.30", default-features = false }

[profile.release]
opt-level = 2